[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
# EIP-170. Fail the build rather than discover this at deploy time.
bytecode_hash = "none"
remappings = [
  "erc8183/=lib/base-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
arc = "https://rpc.testnet.arc.network"
base_sepolia = "https://sepolia.base.org"
