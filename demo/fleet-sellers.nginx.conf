# Path-front for local fleet sellers (one public origin → :4001–4004).
# Used with ngrok/cloudflared so production Chat can reach sellers on your laptop.
#
#   nginx -c $PWD/demo/fleet-sellers.nginx.conf
#   ngrok http 8088
#
# Then point FLEET_SELLERS_PUBLIC_BASE at the https://….ngrok URL (no port).

worker_processes 1;
error_log /tmp/fleet-sellers-nginx-error.log warn;
pid /tmp/fleet-sellers-nginx.pid;

events {
  worker_connections 64;
}

http {
  access_log /tmp/fleet-sellers-nginx-access.log;
  server_tokens off;

  upstream data_fetcher { server 127.0.0.1:4001; }
  upstream analyst      { server 127.0.0.1:4002; }
  upstream writer       { server 127.0.0.1:4003; }
  upstream reviewer     { server 127.0.0.1:4004; }

  server {
    listen 8088;
    server_name _;

    # Liveness for the gateway itself
    location = /healthz {
      default_type application/json;
      return 200 '{"status":"ok","gateway":"fleet-sellers"}';
    }

    location /data {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://data_fetcher;
    }

    location /analysis {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://analyst;
    }

    location /report {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://writer;
    }

    location /review {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://reviewer;
    }

    # Optional per-seller health through the gateway
    location = /healthz/data-fetcher { proxy_pass http://data_fetcher/healthz; }
    location = /healthz/analyst      { proxy_pass http://analyst/healthz; }
    location = /healthz/writer       { proxy_pass http://writer/healthz; }
    location = /healthz/reviewer     { proxy_pass http://reviewer/healthz; }
  }
}
