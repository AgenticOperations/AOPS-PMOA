name: .NET Core CI

on:
  push:
    branches: [ main, dotnet-migration ]
  pull_request:
    branches: [ main, dotnet-migration ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore dotnet/AgentOps.sln

    - name: Build Solution
      run: dotnet build dotnet/AgentOps.sln --configuration Release --no-restore

    - name: Execute Unit and Integration Tests
      run: dotnet test dotnet/AgentOps.sln --configuration Release --no-build --verbosity normal
